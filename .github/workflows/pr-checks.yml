# PR gate for this service.
#
# This repo had NO pull_request workflow, so a PR's "green" meant nothing had
# run — and Renovate reads a branch with no checks as passing, which would have
# let the shared preset automerge dependency bumps unverified. A trailing
# automerge:false rule in renovate.json held the line until this existed; it is
# removed alongside this file.
#
# There are no tests here, so this does not pretend to run any. It verifies the
# two things that are actually verifiable: the dependency tree installs exactly
# as locked, and the image this repo exists to produce still builds with those
# dependencies in it. A broken dependency bump fails one or the other.
name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-checks-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Test & Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node 22 to match the Dockerfile's `FROM node:22-alpine`; a gate running
      # a different major than production would be checking the wrong runtime.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install (exactly as locked)
        run: npm ci

      - name: Parse every entrypoint
        run: |
          set -euo pipefail
          for f in server.js vdoninja.js vdoninja_advanced.js; do
            node --check "$f"
            echo "  $f parses"
          done

      # Builds the real image, so a dependency that fails to install under
      # alpine/node:22 is caught here rather than at deploy.
      - name: Build the image
        run: docker build --tag capturly-live-signaling:pr .
