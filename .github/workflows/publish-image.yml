name: Publish container image

on:
  push:
    branches: [main]

# Keyless push to the capturly project's Artifact Registry via Workload Identity
# Federation — no static registry credentials. The homelab pulls this image with
# the shared keyless AR token (ar-token-refresher), the same as every other app.
permissions:
  contents: read
  id-token: write

env:
  IMAGE: us-central1-docker.pkg.dev/capturly-app/capturly/capturly-live-signaling
  WIF_PROVIDER: projects/614897024362/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  WIF_SA: github-actions@capturly-app.iam.gserviceaccount.com

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SA }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
